[package]
name = "x03-3d"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
wgpu = "=30.0.2"
gltf = { version = "1", default-features = false, features = ["import", "names", "utils", "KHR_materials_unlit"] }
glam = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
smallvec = "1"
anyhow = "1"

[profile.release]
debug = 1
