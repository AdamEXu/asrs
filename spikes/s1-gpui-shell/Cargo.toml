[package]
name = "s1-gpui-shell"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui-kit = { version = "=0.10.0", default-features = false, features = ["component"] }
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.12", features = ["test-support"] }
image = "0.25"
smallvec = "1"
anyhow = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

[profile.release]
debug = 1
