name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ASRS_CI: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  UPSTREAM_REPOSITORY: Mechanical-Advantage/AdvantageScope
  # Keep equal to UPSTREAM_COMMIT in xtask/src/oracle.rs.
  UPSTREAM_COMMIT: 8fc5b89fc93be5dba5a66005ea6111fa16594aa8

jobs:
  # Job-level `if` cannot read the matrix, so the matrix itself is chosen here: while the
  # repository is private only ubuntu-latest runs, since macOS and Windows minutes are billed
  # at a multiple. Linux packages are built on Ubuntu 22.04, whose glibc is then the oldest they
  # run on.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          all='[
            {"os":"ubuntu-latest","package_os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},
            {"os":"ubuntu-24.04-arm","package_os":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu"},
            {"os":"macos-latest","package_os":"macos-latest","target":"aarch64-apple-darwin"},
            {"os":"windows-latest","package_os":"windows-latest","target":"x86_64-pc-windows-msvc"},
            {"os":"windows-11-arm","package_os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}
          ]'
          if [ "$PRIVATE" = "false" ]; then
            filter='.'
          else
            filter='map(select(.os == "ubuntu-latest"))'
          fi
          echo "include=$(jq -c "$filter" <<<"$all")" >> "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  vector-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Generator hashes of committed vectors
        run: cargo run --locked -p xtask -- oracle gen --check-hashes

  build:
    needs: matrix
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:
      # Generated tables and vectors are compared byte for byte, so Windows must not check out CRLF.
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check out upstream AdvantageScope
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: reference/AdvantageScope
          persist-credentials: false
      - name: Install GPUI system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev mesa-vulkan-drivers libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Cache the render host's fonts
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/asrs-fonts
          key: asrs-fonts-${{ hashFiles('xtask/hosts/linux/fonts.sh') }}
      - name: Install the render host's fonts
        if: runner.os == 'Linux'
        run: |
          xtask/hosts/linux/fonts.sh ~/.cache/asrs-fonts "$RUNNER_TEMP/asrs-fonts"
          echo "FONTCONFIG_FILE=$RUNNER_TEMP/asrs-fonts/fonts.conf" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # CI skips the oracle install, so this puts upstream's locked protobufjs where the
      # descriptor table generator looks for it.
      - name: Install protobufjs for the descriptor table check
        run: |
          rm -rf target/oracle/upstream
          node oracle/tools/pinnedInstall.cjs reference/AdvantageScope/package-lock.json target/oracle/upstream protobufjs
          cd target/oracle/upstream
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Layout, vendored gpui crates and generated tables
        run: |
          cargo xtask layout
          cargo xtask harness
          cargo xtask version
          cargo xtask gpui verify
          cargo xtask gpui features
          cargo xtask tables units --check
          cargo xtask tables spark --check
          cargo xtask tables proto-descriptor --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (parity features)
        run: >-
          cargo clippy -p asrs-ui -p asrs-app --all-targets --locked
          --features asrs-ui/parity,asrs-app/parity -- -D warnings
      - name: Test
        timeout-minutes: 30
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test (parity features)
        timeout-minutes: 30
        run: >-
          cargo test -p asrs-ui -p asrs-app --locked
          --features asrs-ui/parity,asrs-app/parity --no-fail-fast

  package:
    needs: matrix
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.package_os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check out upstream AdvantageScope
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: reference/AdvantageScope
          persist-credentials: false
      - name: Install GPUI system packages and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev mesa-vulkan-drivers libgtk-3-dev libwebkit2gtk-4.1-dev \
            squashfs-tools xvfb xauth x11-utils desktop-file-utils libglib2.0-bin \
            shared-mime-info xdg-utils fonts-dejavu-core
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Documentation
        run: cargo xtask docs
      - name: Bundle
        run: cargo xtask bundle
      - name: Smoke test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo xtask smoke
      # Artifacts of a public repository are public, and parts of the documentation may not be
      # published until https://github.com/AdamEXu/asrs/issues/310 is decided. The AppImage is
      # left out for its runtime, which contains LGPL code that comes without its source.
      - name: Bundle without the documentation
        run: cargo xtask bundle --no-docs
      - name: Smoke test without the documentation
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo xtask smoke --no-docs
      - uses: actions/upload-artifact@v4
        with:
          name: asrs-${{ matrix.target }}
          path: |
            target/bundle/host-no-docs/*.dmg
            target/bundle/host-no-docs/*.zip
            target/bundle/host-no-docs/*-setup.exe
            target/bundle/host-no-docs/*.tar.gz
          if-no-files-found: error
      - name: Test-support stays out of release builds
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask gpui release-audit
