[package]
name = "asrs-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
parity = [
    "dep:anyhow",
    "dep:gpui-pre",
    "dep:gpui-pre-platform",
    "gpui-pre/test-support",
    "gpui-pre-platform/test-support",
]

[dependencies]
anyhow = { version = "=1.0.104", optional = true }
asrs-canvas = { path = "../asrs-canvas" }
gpui-kit.workspace = true
gpui-pre = { workspace = true, optional = true }
gpui-pre-platform = { workspace = true, optional = true }
image = { version = "=0.25.10", default-features = false }
roxmltree = "=0.21.2"
simplecss = "=0.2.2"
svgtypes = "=0.16.2"
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
asrs-js = { path = "../asrs-js" }
asrs-parity = { path = "../asrs-parity" }
asrs-tabs = { path = "../asrs-tabs" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "=0.3.2"
default-features = false
features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSToolbar",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "=0.3.2"
default-features = false
features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "=0.3.2"
default-features = false
features = [
    "std",
    "libc",
    "objc2",
    "CGColorSpace",
    "CGDataProvider",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGRemoteOperation",
    "CGWindow",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "=0.3.2"
default-features = false
features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSGeometry",
    "NSObjCRuntime",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSValue",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-quartz-core]
version = "=0.3.2"
default-features = false
features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAMetalLayer"]

[[test]]
name = "headless_capture"
harness = false
required-features = ["parity"]

[[test]]
name = "platform_mac"
harness = false

[lints]
workspace = true

[[example]]
name = "ui_scenes"
required-features = ["parity"]

[[test]]
name = "icon_capture"
harness = false
required-features = ["parity"]

[[test]]
name = "pixel_snap"
harness = false
required-features = ["parity"]

[[test]]
name = "canvas_view"
harness = false
required-features = ["parity"]

[[example]]
name = "text_scenes"
required-features = ["parity"]

[[test]]
name = "text_scroll"
harness = false
required-features = ["parity"]

[[test]]
name = "text_box"
harness = false
required-features = ["parity"]

[[example]]
name = "canvas_frames"
required-features = ["parity"]
