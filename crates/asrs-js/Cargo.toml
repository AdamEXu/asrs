[package]
name = "asrs-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "=0.3.4"
icu_collator = "=1.4.0"
icu_locid = "=1.4.0"
icu_provider = { version = "=1.4.0", features = ["sync"] }
indexmap = "=2.14.2"
jiff = { version = "=1.0.1", features = ["tzdb-bundle-always"] }
# tzdata 2025b, the release in Electron 39's ICU. jiff's own copy only names the system zone.
jiff-tzdb = "=0.1.4"
libloading = "=0.8.9"
ryu-js = "=1.0.3"

[dev-dependencies]
asrs-parity = { path = "../asrs-parity" }

[lints]
workspace = true
