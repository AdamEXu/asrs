[package]
name = "asrs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "asrs"
path = "src/main.rs"

[features]
parity = ["asrs-ui/parity"]

[dependencies]
asrs-js = { path = "../asrs-js" }
asrs-services = { path = "../asrs-services" }
asrs-ui.workspace = true

[dev-dependencies]
asrs-field3d = { path = "../asrs-field3d" }
asrs-parity = { path = "../asrs-parity" }
async-channel = "=2.5.0"
image = { version = "=0.25.10", default-features = false }

[lints]
workspace = true

[[test]]
name = "window_sizes"
harness = false
