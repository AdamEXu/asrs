[package]
name = "asrs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "asrs"
path = "src/main.rs"

[features]
parity = ["asrs-field3d/parity", "asrs-ui/parity"]

[dependencies]
asrs-canvas = { path = "../asrs-canvas" }
asrs-field3d = { path = "../asrs-field3d" }
asrs-formats = { path = "../asrs-formats" }
asrs-hub = { path = "../asrs-hub" }
asrs-js = { path = "../asrs-js" }
asrs-live = { path = "../asrs-live" }
asrs-log = { path = "../asrs-log" }
asrs-model = { path = "../asrs-model" }
asrs-ocr = { path = "../asrs-ocr" }
asrs-services = { path = "../asrs-services" }
asrs-tabs = { path = "../asrs-tabs" }
asrs-ui.workspace = true
async-channel = "=2.5.0"
fs4 = { version = "=1.1.0", default-features = false }
png = "=0.18.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "=0.10.9"
ureq = { version = "=3.5.2", default-features = false, features = ["gzip", "platform-verifier", "rustls-no-provider"] }
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dev-dependencies]
asrs-parity = { path = "../asrs-parity" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "=0.25.10", default-features = false }
socket2 = "=0.6.5"
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true

[[test]]
name = "window_sizes"
harness = false

