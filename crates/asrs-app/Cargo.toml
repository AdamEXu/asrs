[package]
name = "asrs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "asrs"
path = "src/main.rs"

[features]
parity = ["asrs-ui/parity", "dep:png"]

[dependencies]
asrs-canvas = { path = "../asrs-canvas" }
asrs-formats = { path = "../asrs-formats" }
asrs-hub = { path = "../asrs-hub" }
asrs-js = { path = "../asrs-js" }
asrs-log = { path = "../asrs-log" }
asrs-model = { path = "../asrs-model" }
asrs-services = { path = "../asrs-services" }
asrs-ui.workspace = true
async-channel = "=2.5.0"
png = { version = "=0.18.1", optional = true }

[dev-dependencies]
asrs-field3d = { path = "../asrs-field3d" }
asrs-parity = { path = "../asrs-parity" }
asrs-tabs = { path = "../asrs-tabs" }
image = { version = "=0.25.10", default-features = false }

[lints]
workspace = true

[[test]]
name = "window_sizes"
harness = false

[[test]]
name = "tab_bar_layout"
required-features = ["parity"]

[[test]]
name = "hub_entity"
required-features = ["parity"]

[[test]]
name = "parity_scenario"
harness = false
required-features = ["parity"]

[[test]]
name = "app_menu_mac"
harness = false
