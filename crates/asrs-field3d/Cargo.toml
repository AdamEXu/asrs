[package]
name = "asrs-field3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
asrs-canvas = { path = "../asrs-canvas" }
asrs-js = { path = "../asrs-js" }
asrs-log = { path = "../asrs-log" }
asrs-model = { path = "../asrs-model" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
png = "=0.18.1"
pollster = "=0.4.0"
wgpu = { version = "=30.0.2", default-features = false, features = ["metal", "dx12", "vulkan", "wgsl"] }

[dev-dependencies]
asrs-parity = { path = "../asrs-parity" }
sha2 = "=0.10.9"

[lints]
workspace = true
