[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
asrs-ui = { path = "crates/asrs-ui" }

gpui-kit = { version = "=0.10.0", default-features = false, features = ["component"] }
gpui-pre = { version = "=0.3.12", default-features = false }
gpui-pre-platform = { version = "=0.3.12", default-features = false }

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-scheduler = { path = "vendor/gpui-pre-scheduler" }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package.icu_collator]
opt-level = 3

[profile.dev.package.icu_collections]
opt-level = 3

[profile.dev.package.icu_normalizer]
opt-level = 3

[profile.dev.package.zerovec]
opt-level = 3

[profile.dev.package.asrs-parity]
opt-level = 3

[profile.dev.package.asrs-log]
opt-level = 1

[profile.dev.package.asrs-canvas]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
